# Build, make check and the Go backend test scripts
# (libasn1compiler_go/tests/run-*.sh) on pushes to asn1cgo and on pull
# requests that change more than documentation, and on demand. Tag pushes
# do not run it: a tag points at a commit already tested on asn1cgo.
name: CI

# Documentation-only changes are skipped. The Makefile.am files under doc/
# are part of the build, so they are listed again after the doc/ exclusion
# (later patterns win).
on:
  push:
    branches: [asn1cgo]
    paths:
      - '**'
      - '!**/*.md'
      - '!**/README'
      - '!**/LICENSE'
      - '!AUTHORS'
      - '!BUGS'
      - '!ChangeLog'
      - '!FAQ'
      - '!doc/**'
      - 'doc/**/Makefile.am'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!**/README'
      - '!**/LICENSE'
      - '!AUTHORS'
      - '!BUGS'
      - '!ChangeLog'
      - '!FAQ'
      - '!doc/**'
      - 'doc/**/Makefile.am'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  c:
    name: C build and make check (${{ matrix.cc }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both run the tests under AddressSanitizer + UBSan; clang's UBSan
          # also checks unsigned-integer-overflow and nullability.
          - cc: gcc
            arch: x86-64
            runner: ubuntu-24.04
            configure: ''
            packages: ''
          - cc: clang
            arch: x86-64
            runner: ubuntu-24.04
            configure: ''
            packages: libclang-rt-18-dev
          # Native arm64 (linux/arm64 is a supported target of the Go backend).
          - cc: gcc
            arch: arm64
            runner: ubuntu-24.04-arm
            configure: ''
            packages: ''
          - cc: clang
            arch: arm64
            runner: ubuntu-24.04-arm
            configure: ''
            packages: libclang-rt-18-dev
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bison flex ${{ matrix.packages }}
      - name: Configure
        run: |
          autoreconf -i
          ./configure ${{ matrix.configure }}
      - name: Build
        id: build
        run: make -j"$(nproc)" 2>&1 | tee build.log
      # The baseline is the x86-64 gcc warning set; aarch64 gcc can warn
      # differently, so only that leg is checked against it.
      - name: No new compiler warnings
        if: matrix.cc == 'gcc' && matrix.arch == 'x86-64'
        run: sh .github/ci/check-warnings.sh build.log .github/ci/gcc-warnings.txt
      - name: Go backend globals prefixed
        if: matrix.cc == 'gcc'
        run: sh .github/ci/check-go-symbols.sh asn1c
      # Runs even when the warning check failed, as long as the build passed.
      - name: make check
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: make -j"$(nproc)" -k check
      - name: Show failed test logs
        if: failure()
        run: |
          find tests -name test-suite.log | while read -r f; do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

  go:
    name: Go backend tests (Go ${{ matrix.go }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum Go of the generated modules (go.mod: go 1.21.0).
          - go: '1.21.x'
            arch: x86-64
            runner: ubuntu-24.04
            asan: '0'
          # Current Go, plus the go test -asan pass of run-e2e.
          - go: stable
            arch: x86-64
            runner: ubuntu-24.04
            asan: '1'
          # Native arm64.
          - go: '1.21.x'
            arch: arm64
            runner: ubuntu-24.04-arm
            asan: '0'
          - go: stable
            arch: arm64
            runner: ubuntu-24.04-arm
            asan: '1'
    env:
      GOTOOLCHAIN: local
      ASN1CGO_E2E_ASAN: ${{ matrix.asan }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bison flex
      - name: Build asn1c
        id: build
        run: |
          autoreconf -i
          ./configure
          make -j"$(nproc)"
      # Each script exits 0 on pass and 77 when skipped; here a skip is a
      # failure (Go and cgo are installed). Once asn1c is built, every script
      # runs even after an earlier one failed, so one run reports them all.
      - name: run-e2e
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: libasn1compiler_go/tests
        run: sh ./run-e2e.sh
      - name: run-c-invariance
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: libasn1compiler_go/tests
        run: sh ./run-c-invariance.sh
      - name: run-gowork-race
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: libasn1compiler_go/tests
        run: sh ./run-gowork-race.sh
      - name: run-rt-fetch
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: libasn1compiler_go/tests
        run: sh ./run-rt-fetch.sh
      - name: run-stdlib-names
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: libasn1compiler_go/tests
        run: sh ./run-stdlib-names.sh
      - name: run-rt-skeleton-sync
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: libasn1compiler_go/tests
        run: sh ./run-rt-skeleton-sync.sh
      - name: run-feature-matrix
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: libasn1compiler_go/tests
        run: sh ./run-feature-matrix.sh

  # The compiler on Windows: a native 64-bit asn1c.exe from the mingw-w64
  # toolchain of MSYS2. UCRT64 (the Universal CRT that ships with Windows 10
  # and later, and the environment MSYS2 recommends for new work) is the main
  # leg; MINGW64 (the older msvcrt-based one) is kept to catch differences
  # between the two C runtimes, the cross toolchain used to develop this port
  # being msvcrt-based.
  # What is NOT covered yet: compiling and running the generated C code
  # (tests-c-compiler, tests-skeletons, tests-asn1c-smoke) needs the Windows
  # fixes of the runtime in skeletons/; those steps are marked and do not fail
  # the job. Building the generated Go code on Windows is not supported.
  windows:
    name: Windows build and compiler tests (MSYS2 ${{ matrix.msystem }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        msystem: [UCRT64, MINGW64]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The build scripts and the test data need LF; the runner's git
      # converts to CRLF by default.
      - name: Check out without line ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            make autoconf automake libtool bison flex diffutils
          pacboy: >-
            gcc:p
      - name: Configure
        run: |
          autoreconf -fi
          ./configure
      - name: Build
        id: build
        run: make -j"$(nproc)" 2>&1 | tee build.log
      # The compiler sources (libasn1*, asn1c) must build without warnings;
      # warnings in the runtime copies under skeletons/ are the runtime's, and
      # those in libtool's generated wrapper programs (.libs/lt-*.c) are not
      # ours.
      - name: No compiler warnings outside skeletons
        run: |
          if grep -E '\.c:[0-9]+:[0-9]+: warning' build.log | grep -v -e 'skeletons/' -e 'lt-[a-z0-9_]*\.c'; then
            echo "compiler warnings (listed above)"; exit 1
          fi
          echo "No compiler warnings."
      - name: Smoke test asn1c.exe
        run: |
          set -e
          rm -rf smoke && mkdir -p smoke/c smoke/go-parent
          flags="-fincludes-quoted -fcompound-names -findirect-choice -fno-include-deps -gen-PER -no-gen-OER -pdu=auto"
          ./asn1c/asn1c -S skeletons -D smoke/c tests/tests-asn1c-compiler/50-constraint-OK.asn1
          test -s smoke/c/Makefile.am.libasncodec
          test -s smoke/c/constr_TYPE.c
          # the C pass must not have written a single CR
          if grep -rl "$(printf '\r')" smoke/c; then echo "CR in generated files"; exit 1; fi
          # the Go pass (generating only), into a directory below a parent
          ./asn1c/asn1c -S skeletons $flags -D smoke/c -Fgo=smoke/go-parent/gx tests/tests-asn1c-compiler/50-constraint-OK.asn1
          test -s smoke/go-parent/gx/go.mod
          test -s smoke/go-parent/go.work
          if grep -rl "$(printf '\r')" smoke/go-parent; then echo "CR in generated files"; exit 1; fi
          # backslash paths work too
          ./asn1c/asn1c -S skeletons $flags -D smoke\\c\\ -Fgo=smoke\\go-parent\\gy tests/tests-asn1c-compiler/50-constraint-OK.asn1
          test -s smoke/go-parent/gy/go.mod
          # the BER tools
          cd asn1c && sh ./check-xxber.sh
      # make check for what needs only the compiler and the libraries: the
      # parser and fixer unit tests, enber/unber, and the -E/-P output
      # checks of tests-asn1c-compiler.
      - name: make check (compiler only)
        run: |
          make -C libasn1parser check
          make -C libasn1fix check
          make -C asn1c check
          make -C tests/tests-asn1c-compiler check \
            TESTS="check-parsing.sh check-named-bit.sh check-oid-default.sh check-brace-tuple.sh check-default-constructed.sh"
      # TODO: drop continue-on-error once the Windows fixes of the runtime
      # (skeletons/asn_system.h, INTEGER.c, GeneralizedTime.c,
      # converter-example.c) are in; then the whole `make check` can run here.
      - name: Compile and run the generated C (needs the runtime fixes)
        continue-on-error: true
        run: |
          make -C tests/tests-asn1c-compiler check TESTS=check-name-clash.sh
          make -C tests/tests-asn1c-smoke check
          make -j"$(nproc)" -k check
      - name: Show failed test logs
        if: failure()
        run: |
          find . -name test-suite.log | while read -r f; do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
